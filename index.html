<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mis Manos. Mis Uñas.">
  <title>Mis Manos. Mis Uñas.</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="script.js"></script>
  <script type="module" src="carousel.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="#gallery">Mis Manos. Mis Uñas.</a>
    <nav aria-label="Main navigation">
      <a href="#artist">Artist.</a>
      <a href="#about">About.</a>
      <a href="#gallery" aria-current="page">Gallery.</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">
    <section class="gallery" aria-label="Gallery">
      <div class="hand-view" role="img" aria-label="A black three-dimensional hand slowly rotating">
        <p class="hand-message" role="status">Loading hand…</p>
      </div>
      <div class="carousel" aria-label="Image carousel" aria-roledescription="carousel" tabindex="0">
        <div class="carousel-track carousel-track--front"></div>
        <button class="carousel-arrow carousel-arrow--previous" type="button" aria-label="Previous image"><svg viewBox="0 0 100 130" aria-hidden="true"><path d="M91 4H65L5 65l60 61h26L31 65z"/></svg></button>
        <button class="carousel-arrow carousel-arrow--next" type="button" aria-label="Next image"><svg viewBox="0 0 100 130" aria-hidden="true"><path d="M9 4h26l60 61-60 61H9l60-61z"/></svg></button>
        <span class="visually-hidden carousel-status" aria-live="polite"></span>
      </div>
    </section>
    <dialog class="image-dialog" aria-label="Expanded image">
      <button class="image-dialog-close" type="button" aria-label="Close enlarged image">×</button>
      <button class="carousel-arrow image-dialog-arrow image-dialog-arrow--previous" type="button" aria-label="Previous image"><svg viewBox="0 0 100 130" aria-hidden="true"><path d="M91 4H65L5 65l60 61h26L31 65z"/></svg></button>
      <img class="image-dialog-image" alt="">
      <button class="carousel-arrow image-dialog-arrow image-dialog-arrow--next" type="button" aria-label="Next image"><svg viewBox="0 0 100 130" aria-hidden="true"><path d="M9 4h26l60 61-60 61H9l60-61z"/></svg></button>
      <span class="visually-hidden image-dialog-status" aria-live="polite"></span>
    </dialog>
  </main>
</body>
</html>
